name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # FFmpeg para Windows: compilación LGPL compartida de BtbN/FFmpeg-Builds, fijada a una
  # versión concreta para que el CI no cambie solo (DESARROLLO.md §7: LGPL y enlace dinámico).
  FFMPEG_WIN_TAG: autobuild-2026-11-14-12-37
  FFMPEG_WIN_ZIP: ffmpeg-n9.0.2-57-gd838f9f9ae-win64-lgpl-shared-9.0

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: FFmpeg y ALSA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libasound2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libavfilter-dev \
            libswscale-dev libswresample-dev

      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_WIN_TAG/$env:FFMPEG_WIN_ZIP.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP $env:FFMPEG_WIN_ZIP
          "FFMPEG_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
          # Las DLL tienen que estar en el PATH para que corran los tests.
          (Join-Path $dir "bin") | Out-File -Append $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
