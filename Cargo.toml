[workspace]
resolver = "3"
members = ["crates/cinder-core", "apps/cinder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KCRooty/Cinder-Studio"
rust-version = "1.85"

[workspace.dependencies]
cinder-core = { path = "crates/cinder-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
